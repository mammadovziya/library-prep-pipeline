all:
  vars:
    ansible_user: libraryops
    admin_network: 192.0.2.0/24
    backup_mount_path: /mnt/library-prep-backup
    sandboxd_binary_path: ../../build/linux-amd64/library-prep-sandboxd
    # Keep false for the Authentik bootstrap pass. Change to true only after
    # OIDC is configured and control.env contains production OIDC settings.
    platform_start_enabled: false
    # Put all passwords, service environment files, private keys, and
    # certificates in encrypted group_vars/all/vault.yml. Never add them here.
  hosts:
    mscoc6:
      ansible_host: 192.0.2.60
      gpu_type: REPLACE_WITH_QUALIFIED_PROFILE
      gpu_uuid: GPU-REPLACE-WITH-NVIDIA-UUID
  children:
    platform_nodes:
      hosts:
        mscoc6: {}
